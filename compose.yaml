services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mobilend}
      POSTGRES_USER: ${POSTGRES_USER:-mobilend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mobilend-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    working_dir: /app/backend
    volumes:
      - .:/app
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mobilend}
      POSTGRES_USER: ${POSTGRES_USER:-mobilend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mobilend-local-password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-mobilend-insecure-development-only-secret}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
